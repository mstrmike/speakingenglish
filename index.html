<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Тренажёр устной части ОГЭ/ЕГЭ</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 820px; margin: 20px auto; padding: 0 14px; }
    h1, h2, h3 { text-align: center; }
    label { display: inline-block; margin: 6px 0; }
    input, select, button { font: inherit; }
    input, select { padding: 7px; min-width: 220px; }
    button { padding: 9px 16px; margin: 5px; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .6; }
    .center { text-align: center; }
    .hidden { display: none !important; }
    #task { margin: 16px 0; padding: 14px; border: 1px solid #ccc; border-radius: 6px; min-height: 80px; white-space: pre-wrap; font-size: 1.12rem; }
    #timer { font-size: 3rem; color: #8b0000; margin: 12px 0; text-align: center; font-variant-numeric: tabular-nums; }
    #phaseLabel { color: #555; min-height: 24px; }
    .note { color: #555; font-size: .9rem; max-width: 560px; margin: 8px auto; }
    .final-actions button { min-width: 250px; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
</head>
<body>
  <section id="screen-start">
    <h1>Тренажёр устной части</h1>

    <div class="center"><label>Фамилия:<br><input id="lastName" type="text" placeholder="Иванов"></label></div>
    <div class="center"><label>Имя:<br><input id="firstName" type="text" placeholder="Иван"></label></div>
    <div class="center"><label>Класс:<br><input id="className" type="text" placeholder="9А"></label></div>

    <div class="center"><label>Экзамен:<br>
      <select id="examSelect"><option value="oge">ОГЭ</option><option value="ege">ЕГЭ</option></select>
    </label></div>
    <div class="center"><label>Вариант:<br><select id="variantSelect"></select></label></div>

    <div class="center" style="margin-top:16px;">
      <details>
        <summary>У меня есть код для премиум-доступа</summary>
        <p><input id="premiumCodeInput" type="text" placeholder="Введите код доступа">
        <button id="applyPremiumCodeBtn" type="button">Активировать</button></p>
        <div id="premiumStatus" class="note"></div>
      </details>
    </div>

    <div class="center" style="margin-top:18px;"><button id="startExamBtn" type="button">Начать</button></div>
  </section>

  <section id="screen-exam" class="hidden">
    <h2 id="examTitle"></h2>
    <div id="phaseLabel" class="center"></div>
    <div id="task"></div>
    <div class="center"><audio id="questionPlayer" controls style="display:none; width:100%;"></audio></div>
    <audio id="beepPlayer" src="audio/beep.mp3" preload="auto"></audio>
    <audio id="startSpeakingPlayer" src="audio/start_speaking.mp3" preload="auto"></audio>
    <div id="timer">00:00</div>
    <div class="center"><button id="actionBtn" class="hidden" type="button">Закончить запись</button></div>
  </section>

  <section id="screen-final" class="hidden">
    <h2>Экзамен завершён</h2>
    <div class="center final-actions">
      <p>Прослушайте или скачайте готовые записи.</p>
      <div><button id="playDownload1Btn" type="button" disabled>Задание 1</button></div>
      <div><button id="playDownload2Btn" type="button" disabled>Задание 2</button></div>
      <div><button id="playDownload3Btn" type="button" disabled>Задание 3</button></div>
      <div><button id="playDownload4Btn" type="button" disabled>Задание 4</button></div>
      <audio id="finalPlayer" controls style="width:100%; margin-top:14px;"></audio>
    </div>

    <div class="center" style="margin-top:24px;">
      <h3>Отправить ответы учителю</h3>
      <p class="note">MP3-записи и данные ученика будут отправлены выбранному учителю через сервер тренажёра.</p>
      <label>Учитель:<br><select id="teacherSelect" disabled><option value="">Загрузка списка учителей…</option></select></label><br>
      <button id="sendToTeacherBtn" type="button" disabled>Отправить все записи учителю</button>
      <div id="sendEmailStatus" class="note"></div>
    </div>

    <div class="center" style="margin-top:20px;"><button id="backBtn" type="button">Вернуться на старт</button></div>
  </section>

  <script src="tasks.js"></script>
  <script src="script.js"></script>
  <script src="script_oge.js"></script>
  <script src="script_ege.js"></script>
  <script src="email-send.js"></script>
</body>
</html>
